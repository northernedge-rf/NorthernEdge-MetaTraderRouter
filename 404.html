<!doctype html>
<html lang="en">
<head>
  <title>Northern Edge — Outside the route</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#0d0d0d; --text:#e5e5e5; --muted:#8b8985; --line:rgba(229,229,229,.2); --gold:#c48f5a; --gold-soft:#d5a777; }
    * { box-sizing:border-box; }
    body { min-height:100vh; display:grid; place-items:center; margin:0; padding:24px; background:var(--bg); color:var(--text); font-family:"DM Sans",Arial,sans-serif; }
    .box { width:min(620px,100%); padding:clamp(34px,7vw,72px); border:1px solid var(--line); background:#121212; }
    .eyebrow { color:var(--gold); font-family:"DM Mono",monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:42px 0 24px; font-family:"Playfair Display",Georgia,serif; font-size:clamp(58px,10vw,108px); font-weight:500; letter-spacing:-.06em; line-height:.88; }
    p { max-width:430px; color:#b8b5b0; line-height:1.6; }
    a { display:inline-flex; margin-top:24px; padding:13px 17px; border:1px solid var(--gold); color:var(--gold-soft); font-family:"DM Mono",monospace; font-size:10px; letter-spacing:.12em; text-decoration:none; text-transform:uppercase; }
    a:hover { background:var(--gold); color:#17110c; }
  </style>
</head>
<body><main class="box"><div class="eyebrow">Northern Edge / 404</div><h1>Outside<br>the route.</h1><p>The requested page is not available, but the operating system is still intact.</p><a href="./">Return to selected work ↗</a></main></body>
</html>
